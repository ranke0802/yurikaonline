<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">성운의 지팡이</title>
  <desc id="desc">진홍빛 성운 결정과 별고리가 달린 마법 지팡이</desc>
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7ee"/>
      <stop offset="0.42" stop-color="#ba5fa8"/>
      <stop offset="1" stop-color="#402464"/>
    </linearGradient>
    <radialGradient id="orb" cx="36%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#ffd8f5"/>
      <stop offset="0.62" stop-color="#dc5eac"/>
      <stop offset="1" stop-color="#613080"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
