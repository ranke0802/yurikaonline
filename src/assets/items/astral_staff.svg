  <circle cx="39" cy="33" r="16" fill="url(#orb)" stroke="#ffe4f7" stroke-width="3" filter="url(#glow)"/>
  <path d="m39 19 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#fff8df" opacity="0.9"/>
