name: Build isolated offline test artifacts

on:
  push:
    branches: [test/offline-e344562]
    paths:
      - scripts/offline-test/**
      - .github/workflows/offline-test-artifact.yml

permissions:
  contents: read

concurrency:
  group: offline-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/offline-e344562'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify local QA policy and build the exact validated copy
        run: |
          npm run validate:qa-policy
          python3 scripts/offline-test/build.py --output "$RUNNER_TEMP/offline-bundle"
          python3 "$RUNNER_TEMP/offline-bundle/serve.py" --verify-only
      - name: Install Chromium for loopback checks
        run: npx playwright install --with-deps chromium
      - name: Verify manual controls, local saves and network isolation on loopback
        run: |
          python3 "$RUNNER_TEMP/offline-bundle/serve.py" --port 8183 > "$RUNNER_TEMP/offline-server.log" 2>&1 &
          OFFLINE_SERVER_PID=$!
          trap 'kill "$OFFLINE_SERVER_PID"' EXIT
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          export QA_BASE_URL=http://127.0.0.1:8183
          node <<'JS'
          require('./scripts/lib/qa-preflight.cjs');
          (async () => {
            for (let attempt = 0; attempt < 50; attempt++) {
              try { if ((await fetch('http://127.0.0.1:8183/version.txt')).ok) return; } catch {}
              await new Promise(resolve => setTimeout(resolve, 200));
            }
            throw new Error('Loopback server did not become ready');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          QA_OUTPUT="$RUNNER_TEMP/offline-qa/gameplay" node scripts/validate-gameplay-entry-browser.cjs
          QA_OUTPUT="$RUNNER_TEMP/offline-qa/classes" node scripts/offline-test/validate-bundle.cjs
      - name: Recheck contents and split the ZIP into four 24 MiB parts
        run: |
          python3 scripts/offline-test/package.py \
            --bundle "$RUNNER_TEMP/offline-bundle" \
            --qa "$RUNNER_TEMP/offline-qa" \
            --output "$RUNNER_TEMP/offline-delivery" \
            --commit "$GITHUB_SHA"
      # Upload separately: an artifact containing all parts would exceed the
      # receiving tool's 32 MiB file limit. The complete ZIP is never uploaded.
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: yurika-offline-${{ github.sha }}-part01
          path: ${{ runner.temp }}/offline-delivery/yurika-offline-e344562.zip.part01
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: yurika-offline-${{ github.sha }}-part02
          path: ${{ runner.temp }}/offline-delivery/yurika-offline-e344562.zip.part02
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: yurika-offline-${{ github.sha }}-part03
          path: ${{ runner.temp }}/offline-delivery/yurika-offline-e344562.zip.part03
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: yurika-offline-${{ github.sha }}-part04
          path: ${{ runner.temp }}/offline-delivery/yurika-offline-e344562.zip.part04
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload small reconstruction manifest
        uses: actions/upload-artifact@v4
        with:
          name: yurika-offline-${{ github.sha }}-manifest
          path: ${{ runner.temp }}/offline-delivery/manifest/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
