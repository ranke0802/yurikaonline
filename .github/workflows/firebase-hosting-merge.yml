name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - mmorpg_online
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate public assets and local runtime
        run: npm run validate:assets && npm run validate:resources && npm run validate:ui && npm run validate:local-profile && npm run validate:monster-authority && npm run validate:fireball-impact && npm run validate:inventory-compaction && npm run validate:camp-preparation && npm run validate:adventure-summary && npm run validate:camp-online-save && npm run validate:startup-deadlines && npm run validate:classes
      - name: Install Chromium for Web Audio synthesis checks
        run: npx playwright install --with-deps chromium
      - name: Validate existing music and all class sound synthesis
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          npm run validate:audio-all
      - name: Verify real Firebase SDK camp cache lifecycle on loopback
        run: |
          npm install --prefix "$RUNNER_TEMP/yurika-sdk-fixture" --no-package-lock firebase@10.7.1 ws@8
          YURIKA_FIREBASE_FIXTURE_ROOT="$RUNNER_TEMP/yurika-sdk-fixture" node scripts/validate-camp-sdk-cache.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YURIKA_ONLINE }}
          channelId: live
          projectId: yurika-online
      - name: Verify deployed public version and immutable assets
        run: node scripts/verify-hosting-release.mjs
