name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - mmorpg_online
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate local QA policy and release assets
        run: npm run validate:qa-policy && npm run validate:assets
      - name: Validate magic missile facing
        run: npm run validate:missile-facing
      - name: Build release metadata from locally validated hashes
        run: npm run release:manifest
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_E2F0A }}
          channelId: live
          projectId: project-e2f0a
          target: yurika
      # A reviewed push authorizes ONLY this bounded check, not remote game QA.
      - name: Verify release metadata and headers within traffic budget
        env:
          YURIKA_RELEASE_ORIGIN: https://ranke0802-yurika.web.app
          YURIKA_REMOTE_CHECK_APPROVED: '1'
          YURIKA_RELEASE_MAX_REQUESTS: '8'
          YURIKA_RELEASE_MAX_BYTES: '200000'
        run: node scripts/verify-hosting-release.mjs
