name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - mmorpg_online
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate public assets and local runtime
        run: npm run validate:assets && npm run validate:resources && npm run validate:ui && npm run validate:local-profile
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YURIKA_ONLINE }}
          channelId: live
          projectId: yurika-online
      - name: Verify deployed public version and immutable assets
        run: node scripts/verify-hosting-release.mjs
